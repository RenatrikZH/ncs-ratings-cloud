[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API 路由 → Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# 管理后台页面 → Netlify Function (返回 HTML)
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# 管理后台 API → Netlify Function
[[redirects]]
  from = "/admin/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# 静态文件缓存
[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
