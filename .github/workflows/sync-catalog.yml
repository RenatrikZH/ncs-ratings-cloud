name: Sync NCS Catalog

on:
  schedule:
    # Every 30 minutes - picks up new NCS releases automatically & syncs to DB
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of latest pages to check (default 3)'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Turso client)
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund --silent || true; fi

      - name: Run incremental sync + DB upsert
        env:
          NCS_SYNC_PAGES: ${{ github.event.inputs.pages || 3 }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          node __sync_latest.cjs "$NCS_SYNC_PAGES"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "No changes to catalog.json; nothing to commit."
          else
            git commit -m "chore: sync NCS catalog (auto)"
            git push
          fi
